# Paste into the workspace root Cargo.toml. These lint LEVELS make the gate self-protecting:
# - allow_attributes_without_reason = "deny" → an agent can't SILENTLY `#[allow(...)]` a lint to
#   pass; every allow must carry `, reason = ".."`, which the reviewer then judges (verified: clippy
#   errors `allow attribute without specifying a reason`).
# - disallowed_methods/types = "deny" → the clippy.toml bans (SystemTime::now, thread::sleep, …) bite.
#
# A per-member crate that defines its OWN [lints] table REPLACES (does not merge) this one — that is
# a silent way to re-open a deny. check-gate.sh and rust-reviewer flag it; keep `lints.workspace = true`
# in every member crate.

[workspace.lints.rust]
unsafe_code = "forbid"            # drop to "deny" (then re-allow per-module) if you genuinely need unsafe

[workspace.lints.clippy]
# --- broad groups: negative priority so the specific levels below win ---
# NOT optional hygiene. As of clippy 1.97 `overly_complex_bool_expr` moved
# correctness → pedantic and `nonminimal_bool` moved complexity → pedantic, so both
# are allow-by-default and absent from `clippy::all`. A bare `-- -D warnings` gate
# therefore passes an always-false expression. Verified on clippy 0.1.97:
# `pub fn b(x: bool) -> bool { x && !x }` is clean under the bare gate and reports
# "this boolean expression contains a logic bug" only once pedantic is on.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# restriction-tier, so neither group above turns it on. Without it,
# `let _ = validate(x);` silently discards a validation the gate cannot see.
let_underscore_must_use = "warn"
# --- unsafe-doctrine enforcement (see rules/unsafe.md) ---
# Both restriction-tier, so `pedantic`/`nursery` above do NOT turn them on. Verified on
# clippy 0.1.98: a probe crate with two uncommented `unsafe` blocks scores 0 hits under
# `-W clippy::pedantic -W clippy::nursery`, 2 hits once `undocumented_unsafe_blocks` is
# enabled explicitly — without this line, this plugin's most-repeated rule (`// SAFETY:`
# on every unsafe block, stated in 10 doctrine files) ships with no mechanical guard.
undocumented_unsafe_blocks = "warn"     # requires the `// SAFETY:` comment
multiple_unsafe_ops_per_block = "warn"  # requires one unsafe op per `unsafe { }` block
# --- gate self-protection ---
allow_attributes_without_reason = "deny"   # no silent #[allow]; a reason is mandatory
allow_attributes = "warn"                  # prefer #[expect] over #[allow] where it fits
# --- the anti-hang / nondeterminism bans (list lives in clippy.toml) ---
disallowed_methods = "deny"
disallowed_types = "deny"
# --- recurring footguns ---
unwrap_used = "deny"
expect_used = "deny"

# Then, in EVERY member crate's Cargo.toml:
# [lints]
# workspace = true
