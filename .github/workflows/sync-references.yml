name: plugin quality

# skills/*/references/ is generated from docs/ and rules/. If an edit to a canonical
# doc never reaches the copies, every standalone skill install ships the stale text.
on:
  pull_request:
    paths:
      - '.agents/**'
      - '.github/workflows/sync-references.yml'
      - 'plugins/rust-studio/**'
      # The root landing pages are under the prose gate (RS-DOC-094), so a PR that touches
      # only them still has to run the validator.
      - 'README.md'
      - 'INSTALL.md'
      - 'CONTRIBUTING.md'
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The prose gate diffs touched sentences against the PR base; the default depth
          # of 1 has no base to diff against, so the checker exits 2 and RS-DOC-095 fires.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Resolve the base the prose gate diffs against
        # A pull request diffs against its base branch, a push against the commit before
        # it, in both cases from the merge base so a base branch that moved on does not
        # count its own commits as this change. A branch creation reports the all-zero sha
        # as "before", and a force-push leaves one nothing fetched can reach; the parent of
        # the pushed commit stands in for both. Read through env, not interpolated.
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=HEAD~1
          if [ -n "$EVENT_BASE" ] && [ "$EVENT_BASE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$EVENT_BASE^{commit}" 2>/dev/null; then
            base=$(git merge-base "$EVENT_BASE" HEAD) || base=HEAD~1
          fi
          echo "PROSE_GATE_BASE=$base" >> "$GITHUB_ENV"
          echo "prose gate base: $base"
      - name: Validate manifests, skills, metadata, and references
        run: ./scripts/validate-distribution.sh
        working-directory: plugins/rust-studio
      - name: Test hooks and status-line scripts
        run: bun test
        working-directory: plugins/rust-studio

  host-validators:
    # The hosts' own validators: Claude Code's strict plugin/marketplace check and agnix, the
    # cross-host agent-config linter (Claude Code, Cursor, Codex, Copilot, Kiro rules).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: claude plugin validate --strict
        run: |
          claude plugin validate --strict --json plugins/rust-studio
          claude plugin validate --strict --json .
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      # Pinned: an unpinned agnix turned main red on a tool bump, not a repo change
      # (0.52.1 started reading the `$8.42` in /progress-bar's example as an indexed
      # $ARGUMENTS use). Bump this deliberately, so a new rule arrives in its own commit.
      - name: agnix --strict
        run: |
          cargo binstall -y agnix-cli@0.52.1
          agnix --strict plugins/rust-studio
