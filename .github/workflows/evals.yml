name: agent evals

# The studio's prompts ARE its source code. `skills/`, `agents/`, `rules/`, `hooks/` and
# `docs/` decide what the reviewer catches, and an edit to any of them can regress recall
# exactly the way a code edit regresses a test — silently, and only in behavior. The
# distribution validator and `bun test` check that the files are well-formed; nothing until
# this job checked that they still do their job.
#
# MANUAL ONLY, on purpose. Every run of this suite bills real model calls, and the maintainer
# runs it locally instead — the deterministic gates (`bun test`, validate-distribution.sh,
# `claude plugin validate --strict`, `agnix --strict`) are the ones that guard a PR, and they
# cost nothing. Measured 2026-09-05: one run of each of the 31 cases is ~$60 (routing cases
# ~$0.75, review cases $1.08-$3.76); at the frontmatter default of `runs: 3` the full suite is
# ~$180. Neither belongs on a per-PR trigger. Dispatch it deliberately, or run the same cases
# locally with `bun tools/eval-runner.ts`.
on:
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # `plugin eval` bills real model calls, so the suite runs only where a key exists.
      # A fork PR has no secret and must not fail on that account — it reports skipped, and
      # the job stays green. Anything else would make the gate a barrier to contribution
      # rather than a check on the studio.
      - id: key
        name: Check for an API key
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Agent evals skipped::No ANTHROPIC_API_KEY available (expected on fork PRs). The suite runs on the nightly schedule from the base repo."
          fi

      - name: Install Claude Code
        if: steps.key.outputs.present == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `claude plugin eval` is early access. Where it is not enabled the command prints a
      # notice and exits without scoring, which would make an unconditional gate report a
      # pass it never measured. Probe first, and say which of the two happened.
      - id: probe
        name: Probe eval availability
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out=$(claude plugin eval plugins/rust-studio --case routing-start --runs 1 \
                  --ablation none --no-publish 2>&1 || true)
          echo "$out" | tail -20
          if echo "$out" | grep -qi 'early access'; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Agent evals skipped::\`claude plugin eval\` is not enabled for this account. Run /eval-agents in a session for the same fixtures."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the eval suite
        if: steps.probe.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval plugins/rust-studio \
            --no-publish \
            --threshold 0.8 \
            --max-cost-usd 15

      # Where plugin eval is not enabled, the in-repo runner measures the same cases over the
      # headless CLI (`claude -p --plugin-dir`), with the same shape of gate: a mean score below
      # the threshold fails the job, and a total-spend cap bounds the bill. It does not run the
      # no-plugin baseline arm — its number is absolute, not a delta — which is why the two
      # steps are not interchangeable and both are kept.
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.present == 'true' && steps.probe.outputs.enabled != 'true'
      - name: Run the eval suite (in-repo runner fallback)
        if: steps.key.outputs.present == 'true' && steps.probe.outputs.enabled != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: plugins/rust-studio
        run: |
          # The gate fails on a budget-truncated suite, so the cap has to cover what actually
          # runs: `--runs 1` over 31 cases measured ~$60, so $75 leaves headroom. Raise both
          # together if you want the frontmatter `runs: 3` (~$180) instead.
          bun tools/eval-runner.ts --runs 1 --parallel 3 --budget 4 --total-budget 75 \
            --threshold 0.8 --out evals/results/ci

      - name: Upload results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: plugins/rust-studio/evals/results/
          if-no-files-found: ignore
